name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run check
      - name: Verify tag matches manifest
        run: test "$GITHUB_REF_NAME" = "v$(bun -e 'console.log(require(\"./manifest.json\").version)')"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" manifest.json main.js styles.css --verify-tag --generate-notes
